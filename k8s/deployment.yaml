apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-rabbitmq-filter
  namespace: ci
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-rabbitmq-filter
  template:
    metadata:
      labels:
        app: go-rabbitmq-filter
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: go-rabbitmq-filter
          image: ghcr.io/gopersonalcluster/go-rabbitmq-filter:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              protocol: TCP

          envFrom:
            - secretRef:
                name: go-rabbitmq-filter-env

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3