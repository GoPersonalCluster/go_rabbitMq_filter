apiVersion: apps/v1
kind: Deployment

metadata:
  name: go-rabbitmq-filter
  namespace: ci

spec:
  replicas: 2

  selector:
    matchLabels:
      app: go-rabbitmq-filter

  template:
    metadata:
      labels:
        app: go-rabbitmq-filter

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: go-rabbitmq-filter

          image: ghcr.io/waltereidi/go-rabbitmq-filter:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: RABBITMQ_HOST
              value: rabbitmq

            - name: RABBITMQ_PORT
              value: "5672"

            - name: RABBITMQ_USER
              value: guest

            - name: RABBITMQ_PASSWORD
              value: guest

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5