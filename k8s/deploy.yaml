apiVersion: apps/v1
kind: Deployment

metadata:
  name: golang-app
  namespace: ci

spec:
  replicas: 2

  selector:
    matchLabels:
      app: golang-app

  template:

    metadata:
      labels:
        app: golang-app

    spec:

      imagePullSecrets:
      - name: ghcr-secret

      containers:

      - name: golang-app

        image: ghcr.io/waltereidi/GoPersonalCluster/golang-app:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:

          httpGet:
            path: /health
            port: 8080

          initialDelaySeconds: 15
          periodSeconds: 10

        readinessProbe:

          httpGet:
            path: /health
            port: 8080

          initialDelaySeconds: 5
          periodSeconds: 5