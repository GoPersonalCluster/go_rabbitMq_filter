name: RabbitMQ Handler CI

on:
  workflow_run:
    workflows: [Build]
    types:
      - completed

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy PostgreSQL and RabbitMQ
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
    
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GO_PERSONAL_CLUSTER_ACTOR }}
          password: ${{ secrets.GO_PERSONAL_CLUSTER_TOKEN }}