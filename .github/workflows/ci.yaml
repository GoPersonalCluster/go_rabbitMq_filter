name: RabbitMQ Handler CI

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gopersonalcluster/go-rabbitmq-filter

jobs:
  deploy:
    name: Build and Deploy Golang app
    runs-on: ubuntu-latest

    # Executa somente se o workflow Build terminou com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Usa exatamente o commit que executou o workflow Build
          ref: ${{ github.event.workflow_run.head_sha }}

      # ============================================================
      # Setup Go
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # ============================================================
      # Definir versão da imagem
      # ============================================================
      - name: Definir imagem Docker
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Imagem:"
          echo "${IMAGE}:${IMAGE_TAG}"
          echo
          echo "Latest:"
          echo "${IMAGE}:latest"
          echo "=========================================="

      # ============================================================
      # Login no GitHub Container Registry
      # ============================================================
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GO_PERSONAL_CLUSTER_ACTOR }}
          password: ${{ secrets.GO_PERSONAL_CLUSTER_TOKEN }}

      # ============================================================
      # Build da imagem
      #
      # Serão criadas duas tags para a MESMA imagem:
      #
      #   ghcr.io/gopersonalcluster/go-rabbitmq-filter:<SHA>
      #   ghcr.io/gopersonalcluster/go-rabbitmq-filter:latest
      # ============================================================
      - name: Build Docker Image
        run: |
          docker build \
            -t "${IMAGE}:${IMAGE_TAG}" \
            -t "${IMAGE}:latest" \
            .

      # ============================================================
      # Push para GHCR
      # ============================================================
      - name: Push Docker Image
        run: |
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"

      # ============================================================
      # Configurar kubeconfig
      # ============================================================
      - name: Configurar kubeconfig
        run: |
          mkdir -p ~/.kube

          printf '%s' '${{ secrets.KUBE_CONFIG }}' > ~/.kube/config

          chmod 600 ~/.kube/config

          echo "Validando kubeconfig..."

          kubectl config current-context
          kubectl cluster-info
          kubectl get namespaces

      # ============================================================
      # Mostrar arquivos Kubernetes
      # ============================================================
      - name: Mostrar configuração Kubernetes
        run: |
          echo "========== namespace.yaml =========="
          cat k8s/namespace.yaml

          echo
          echo "========== deployment.yaml =========="
          cat k8s/deployment.yaml

          echo
          echo "========== service.yaml =========="
          cat k8s/service.yaml

          echo
          echo "===================================="

      # ============================================================
      # Aplicar recursos Kubernetes
      # ============================================================
      - name: Aplicar Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # ============================================================
      # Atualizar Deployment
      #
      # IMPORTANTE:
      # O Kubernetes recebe EXATAMENTE a mesma imagem que acabou
      # de ser enviada para o GHCR.
      # ============================================================
      - name: Atualizar imagem do Deployment
        run: |
          echo "Atualizando Deployment..."

          kubectl -n ci set image deployment/go-rabbitmq-filter \
            go-rabbitmq-filter="${IMAGE}:${IMAGE_TAG}"

      # ============================================================
      # Verificar imagem configurada
      # ============================================================
      - name: Verificar imagem configurada
        run: |
          echo "Imagem configurada no Kubernetes:"

          kubectl -n ci get deployment go-rabbitmq-filter \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo

      # ============================================================
      # Aguardar rollout
      # ============================================================
      - name: Aguardar Deployment
        run: |
          kubectl rollout status deployment/go-rabbitmq-filter \
            -n ci \
            --timeout=10m

      # ============================================================
      # Verificar Pods
      # ============================================================
      - name: Verificar Pods
        run: |
          kubectl get pods -n ci -o wide

      # ============================================================
      # Verificar imagem efetivamente utilizada pelos Pods
      # ============================================================
      - name: Verificar imagens dos Pods
        run: |
          echo "=========================================="
          echo "Imagens dos Pods"
          echo "=========================================="

          kubectl get pods \
            -n ci \
            -l app=go-rabbitmq-filter \
            -o custom-columns="POD:.metadata.name,IMAGE:.spec.containers[0].image,STATUS:.status.phase"

          echo "=========================================="