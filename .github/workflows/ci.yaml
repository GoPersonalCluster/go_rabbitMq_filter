name: RabbitMQ Handler CI

on:
  workflow_run:
    workflows: [Build] 
    types:
      - completed 

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Golang app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
      - name: Nome da imagem 
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
    
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GO_PERSONAL_CLUSTER_ACTOR }}
          password: ${{ secrets.GO_PERSONAL_CLUSTER_TOKEN }}

      - name: Build Image
        run: |
          docker build \
            -t ghcr.io/$IMAGE_NAME/golang-app:${{ github.sha }} \
            -t ghcr.io/$IMAGE_NAME/golang-app:latest .

      - name: Push Image
        run: |
          docker push ghcr.io/$IMAGE_NAME/golang-app:${{ github.sha }}
          docker push ghcr.io/$IMAGE_NAME/golang-app:latest

      - name: Configurar kubectl
        run: |
          mkdir -p ~/.kube

          cat <<EOF > ~/.kube/config
          ${{ secrets.KUBE_CONFIG }}
          EOF

              chmod 600 ~/.kube/config
      - name: Diagnóstico Kubernetes
        run: |
          kubectl version --client
          kubectl config current-context
          kubectl cluster-info
          kubectl get namespaces
          
      - name: Mostrar namespace.yaml
        run: |
          echo "========== namespace.yaml =========="
          cat k8s/namespace.yaml
          echo "===================================="

      - name: Atualizar Deployment
        run: |

          kubectl apply -f k8s/namespace.yaml

          kubectl apply -f k8s/deployment.yaml

          kubectl apply -f k8s/service.yaml

          kubectl rollout restart deployment/golang-app -n ci

          kubectl rollout status deployment/golang-app -n ci